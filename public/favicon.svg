<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a7bef"/>
      <stop offset="0.55" stop-color="#1f4e9c"/>
      <stop offset="1" stop-color="#0e2552"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e4fb"/>
    </linearGradient>
    <linearGradient id="clear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="beadGold" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#f2b33d"/>
    </radialGradient>
    <radialGradient id="beadWhite" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9cdf3"/>
    </radialGradient>
    <clipPath id="capsule"><rect x="192" y="372" width="640" height="280" rx="140"/></clipPath>
    <clipPath id="clearHalf"><rect x="512" y="372" width="320" height="280"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(512 512) scale(1.1) translate(-512 -512) rotate(-45 512 512)">
    <!-- soft shadow -->
    <rect x="212" y="430" width="620" height="260" rx="130" fill="#061433" opacity="0.45" filter="url(#shadow)" transform="translate(18 26)"/>

    <g clip-path="url(#capsule)">
      <!-- solid half -->
      <rect x="192" y="372" width="320" height="280" fill="url(#solid)"/>
      <!-- clear half -->
      <rect x="512" y="372" width="320" height="280" fill="url(#clear)"/>
      <!-- beads visible through the clear half -->
      <g clip-path="url(#clearHalf)">
        <circle cx="566" cy="590" r="38" fill="url(#beadGold)"/>
        <circle cx="632" cy="608" r="34" fill="url(#beadWhite)"/>
        <circle cx="700" cy="598" r="38" fill="url(#beadGold)"/>
        <circle cx="764" cy="604" r="32" fill="url(#beadWhite)"/>
        <circle cx="600" cy="540" r="30" fill="url(#beadWhite)"/>
        <circle cx="666" cy="548" r="34" fill="url(#beadGold)"/>
        <circle cx="734" cy="546" r="30" fill="url(#beadWhite)"/>
        <circle cx="790" cy="560" r="26" fill="url(#beadGold)"/>
        <circle cx="548" cy="532" r="24" fill="url(#beadGold)"/>
      </g>
      <!-- seam where the halves meet -->
      <rect x="500" y="372" width="24" height="280" fill="#c3d5f7"/>
      <rect x="500" y="372" width="6" height="280" fill="#ffffff" opacity="0.8"/>
      <!-- gloss -->
      <rect x="240" y="404" width="236" height="26" rx="13" fill="#ffffff" opacity="0.95"/>
      <rect x="560" y="404" width="220" height="22" rx="11" fill="#ffffff" opacity="0.55"/>
    </g>
    <!-- crisp outline of the clear half -->
    <path d="M512 382 H692 A130 130 0 0 1 692 642 H512" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
  </g>
</svg>
